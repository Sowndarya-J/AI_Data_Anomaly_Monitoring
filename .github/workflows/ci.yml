name: AI Data Anomaly Monitoring CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MySQL Server
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server mysql-client

      - name: Start MySQL
        run: |
          sudo systemctl start mysql
          sudo systemctl status mysql --no-pager

      - name: Configure MySQL
        run: |
          sudo mysql --protocol=socket -e "CREATE DATABASE IF NOT EXISTS ecommerce_db;"
          sudo mysql --protocol=socket -e "CREATE USER IF NOT EXISTS 'testuser'@'localhost' IDENTIFIED BY 'testpassword';"
          sudo mysql --protocol=socket -e "ALTER USER 'testuser'@'localhost' IDENTIFIED BY 'testpassword';"
          sudo mysql --protocol=socket -e "GRANT ALL PRIVILEGES ON ecommerce_db.* TO 'testuser'@'localhost';"
          sudo mysql --protocol=socket -e "FLUSH PRIVILEGES;"

      - name: Verify MySQL
        run: |
          mysql -h 127.0.0.1 -u testuser -ptestpassword -e "SELECT VERSION();"
          mysql -h 127.0.0.1 -u testuser -ptestpassword -e "SHOW DATABASES;"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx2

      - name: Load transaction data
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: ecommerce_db
        run: |
          python src/load_to_mysql.py

      - name: Run Pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: ecommerce_db
        run: |
          pytest -v