name: AI Data Anomaly Monitoring CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: ecommerce_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -ptestpassword && break
            sleep 2
          done

      - name: Verify MySQL
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword -e "SELECT VERSION();"
          mysql -h 127.0.0.1 -u root -ptestpassword -e "SHOW DATABASES;"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx2

      - name: Load transaction data
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: ecommerce_db
        run: |
          python src/load_to_mysql.py

      - name: Run anomaly detection
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: ecommerce_db
        run: |
          python src/anomaly_detection/anomaly_detector.py

      - name: Verify anomaly results
        run: |
          test -f reports/anomaly_results.csv
          echo "Anomaly results file created successfully"
          wc -l reports/anomaly_results.csv

      - name: Run Pytest
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: testpassword
          DB_NAME: ecommerce_db
        run: |
          pytest -v